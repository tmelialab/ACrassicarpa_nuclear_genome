[General]
job_type = local
job_prefix = nextDenovo
task = all
rewrite = yes
deltmp = no
rerun = 3
parallel_jobs = 2
input_type = raw
read_type = ont
input_fofn = 01_input.fofn
workdir = hasil

[correct_option]
read_cutoff = 1k
genome_size = 900m
sort_options = -m 16g -t 8
minimap2_options_raw = -t 32
pa_correction = 8
correction_options = -p 8
seed_cutoff = 12796

[assemble_option]
minimap2_options_cns = -t 32
nextgraph_options = -a 1
